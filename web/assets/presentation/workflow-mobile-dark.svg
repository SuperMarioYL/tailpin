<svg xmlns="http://www.w3.org/2000/svg" width="400" height="920" viewBox="0 0 400 920" data-palette="5956e6-af6ae7-acc6f6-ab1706e61153" role="img" aria-labelledby="tp-wfm-dark-title tp-wfm-dark-desc"><title id="tp-wfm-dark-title">tailpin update loop (mobile)</title><desc id="tp-wfm-dark-desc">The one-second update loop as a vertical composition.</desc>
