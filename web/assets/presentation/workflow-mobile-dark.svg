</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.tp-wfm-dark-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.tp-wfm-dark-flow{animation:tp-wfm-dark-flow 5.5s linear infinite}@keyframes tp-wfm-dark-flow{to{stroke-dashoffset:-180}}.tp-wfm-dark-pulse{animation:tp-wfm-dark-pulse 4.2s ease-in-out infinite}@keyframes tp-wfm-dark-pulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style>
<rect width="400" height="920" rx="14" fill="#050712"/>
<rect width="400" height="920" rx="14" fill="url(#tp-wfm-dark-halo)"/>
<pattern id="tp-wfm-dark-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#171841" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="400" height="920" rx="14" fill="url(#tp-wfm-dark-grid)"/><text x="28" y="44" fill="#969cc4" font-size="12" letter-spacing="2">ONE-SECOND LOOP</text><text x="28" y="74" fill="#eef4fd" font-size="18" font-weight="700">From append to pinned answer</text><rect x="28" y="108" width="344" height="64" rx="10" fill="#0c101f" stroke="#6f6ce9" stroke-width="1.6"/><text x="44" y="136" fill="#6f6ce9" font-size="15" font-weight="700" >session .jsonl</text><text x="44" y="156" fill="#969cc4" font-size="11.5" class="tp-wfm-dark-mono">read-only · append-only poll · 250 ms</text><path d="M200 178 V198" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wfm-dark-arrow)" class="tp-wfm-dark-flow"/><rect x="28" y="208" width="344" height="64" rx="10" fill="#0c101f" stroke="#171841" stroke-width="1"/><text x="44" y="236" fill="#eef4fd" font-size="15" font-weight="600" >transcript adapter</text><text x="44" y="256" fill="#969cc4" font-size="11.5" class="tp-wfm-dark-mono">lift assistant text spans</text><path d="M200 278 V298" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wfm-dark-arrow)" class="tp-wfm-dark-flow"/><rect x="28" y="308" width="344" height="64" rx="10" fill="#0c101f" stroke="#171841" stroke-width="1"/><text x="44" y="336" fill="#eef4fd" font-size="15" font-weight="600" >pin extractor</text><text x="44" y="356" fill="#969cc4" font-size="11.5" class="tp-wfm-dark-mono">recency + markers + code + paths</text><path d="M200 378 V398" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wfm-dark-arrow)" class="tp-wfm-dark-flow"/><rect x="28" y="408" width="344" height="64" rx="10" fill="#0c101f" stroke="#171841" stroke-width="1"/><text x="44" y="436" fill="#eef4fd" font-size="15" font-weight="600" >pin store</text><text x="44" y="456" fill="#969cc4" font-size="11.5" class="tp-wfm-dark-mono">atomic write · revision++</text><path d="M200 478 V498" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wfm-dark-arrow)" class="tp-wfm-dark-flow"/><rect x="28" y="508" width="344" height="64" rx="10" fill="#0c101f" stroke="#6f6ce9" stroke-width="1.6"/><text x="44" y="536" fill="#6f6ce9" font-size="15" font-weight="700" >panel redraw</text><text x="44" y="556" fill="#969cc4" font-size="11.5" class="tp-wfm-dark-mono">TUI / --plain · within ~1 s</text><g opacity="0.75"><rect x="28" y="614" width="48.4" height="22" rx="11" fill="#0a0d1d" stroke="#171841"/><text x="39" y="629" fill="#969cc4" font-size="11" class="tp-wfm-dark-mono">mode</text></g><g opacity="0.75"><rect x="86.4" y="614" width="121" height="22" rx="11" fill="#0a0d1d" stroke="#171841"/><text x="97.4" y="629" fill="#969cc4" font-size="11" class="tp-wfm-dark-mono">queue-operation</text></g><g opacity="0.75"><rect x="217.4" y="614" width="160.6" height="22" rx="11" fill="#0a0d1d" stroke="#171841"/><text x="228.4" y="629" fill="#969cc4" font-size="11" class="tp-wfm-dark-mono">file-history-snapshot</text></g><text x="28" y="664" fill="#969cc4" font-size="11">skipped by type</text><line x1="28" y1="686" x2="372" y2="686" stroke="#171841"/><text x="28" y="710" fill="#969cc4" font-size="11" class="tp-wfm-dark-mono">revision++ on answer change; continues from disk</text>
