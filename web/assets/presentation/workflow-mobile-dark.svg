<linearGradient id="tp-wfm-dark-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f6ce9"/><stop offset="0.55" stop-color="#af6ae7"/><stop offset="1" stop-color="#acc6f6"/></linearGradient>
<radialGradient id="tp-wfm-dark-halo" cx="0.62" cy="0.36" r="0.85"><stop stop-color="#6f6ce9" stop-opacity="0.2"/><stop offset="1" stop-color="#050712" stop-opacity="0"/></radialGradient>
