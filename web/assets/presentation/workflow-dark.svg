</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.tp-wf-dark-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.tp-wf-dark-flow{animation:tp-wf-dark-flow 5.5s linear infinite}@keyframes tp-wf-dark-flow{to{stroke-dashoffset:-180}}.tp-wf-dark-pulse{animation:tp-wf-dark-pulse 4.2s ease-in-out infinite}@keyframes tp-wf-dark-pulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style>
