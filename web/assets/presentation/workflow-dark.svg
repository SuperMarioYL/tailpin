<radialGradient id="tp-wf-dark-halo" cx="0.62" cy="0.36" r="0.85"><stop stop-color="#6f6ce9" stop-opacity="0.2"/><stop offset="1" stop-color="#050712" stop-opacity="0"/></radialGradient>
