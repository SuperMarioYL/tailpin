rite</text><text x="676" y="162" fill="#969cc4" font-size="11.5" class="tp-wf-dark-mono">temp + rename</text><text x="676" y="180" fill="#969cc4" font-size="11.5" class="tp-wf-dark-mono">revision++</text><rect x="868" y="96" width="168" height="82" rx="10" fill="#0c101f" stroke="#6f6ce9" stroke-width="1.6"/><text x="884" y="124" fill="#6f6ce9" font-size="15" font-weight="700" >panel redraw</text><text x="884" y="144" fill="#969cc4" font-size="11.5" class="tp-wf-dark-mono">TUI / --plain</text><text x="884" y="162" fill="#969cc4" font-size="11.5" class="tp-wf-dark-mono">within ~1 s</text><path d="M210 142 H234" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wf-dark-arrow)" class="tp-wf-dark-flow"/><path d="M418 142 H442" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wf-dark-arrow)" class="tp-wf-dark-flow"/><path d="M626 142 H650" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wf-dark-arrow)" class="tp-wf-dark-flow"/><path d="M834 142 H858" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-wf-dark-arrow)" class="tp-wf-dark-flow"/><path d="M224 202 V244" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#tp-wf-dark-arrow)" class="tp-wf-dark-flow"/><g opacity="0.75"><rect x="250" y="252" width="48.4" height="22" rx="11" fill="#0a0d1d" stroke="#171841"/><text x="261" y="267" fill="#969cc4" font-size="11" class="tp-wf-dark-mono">mode</text></g><g opacity="0.75"><rect x="308.4" y="252" width="121" height="22" rx="11" fill="#0a0d1d" stroke="#171841"/><text x="319.4" y="267" fill="#969cc4" font-size="11" class="tp-wf-dark-mono">queue-operation</text></g><g opacity="0.75"><rect x="439.4" y="252" width="160.6" height="22" rx="11" fill="#0a0d1d" stroke="#171841"/><text x="450.4" y="267" fill="#969cc4" font-size="11" class="tp-wf-dark-mono">file-history-snapshot</text></g><g opacity="0.75"><rect x="610" y="252" width="81.4" height="22" rx="11" fill="#0a0d1d" stroke="#171841"/><text x="621" y="267" fill="#969cc4" font-size="11" class="tp-wf-dark-mono">sidechain</text></g><text x="715.4" y="267" fill="#969cc4" font-size="11">skipped by type</text><text x="36" y="42" fill="#969cc4" font-size="12" letter-spacing="2">ONE-SECOND LOOP</text>
<text x="36" y="72" fill="#eef4fd" font-size="19" font-weight="700">From append to pinned answer</text>
<line x1="36" y1="392" x2="964" y2="392" stroke="#171841"/>
<text x="36" y="418" fill="#969cc4" font-size="12" class="tp-wf-dark-mono">answer text changed → revision++ → artifact continues from disk across restarts</text>
