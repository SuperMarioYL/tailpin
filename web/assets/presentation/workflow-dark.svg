<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" data-palette="5956e6-af6ae7-acc6f6-ab1706e61153" role="img" aria-labelledby="tp-wf-dark-title tp-wf-dark-desc"><title id="tp-wf-dark-title">tailpin update loop</title><desc id="tp-wf-dark-desc">From append-only polling to the redrawn pinned panel within about a second.</desc>
