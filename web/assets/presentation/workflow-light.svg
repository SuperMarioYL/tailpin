<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.tp-wf-light-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.tp-wf-light-flow{animation:tp-wf-light-flow 5.5s linear infinite}@keyframes tp-wf-light-flow{to{stroke-dashoffset:-180}}.tp-wf-light-pulse{animation:tp-wf-light-pulse 4.2s ease-in-out infinite}@keyframes tp-wf-light-pulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style>
