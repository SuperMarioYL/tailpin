<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" data-palette="5956e6-af6ae7-acc6f6-ab1706e61153" role="img" aria-labelledby="tp-ar-dark-title tp-ar-dark-desc"><title id="tp-ar-dark-title">tailpin architecture</title><desc id="tp-ar-dark-desc">One Go binary: transcript adapter, pin extractor, pin store, bubbletea TUI and the revisioned pin artifact.</desc>
<defs>
<linearGradient id="tp-ar-dark-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f6ce9"/><stop offset="0.55" stop-color="#af6ae7"/><stop offset="1" stop-color="#acc6f6"/></linearGradient>
<radialGradient id="tp-ar-dark-halo" cx="0.62" cy="0.36" r="0.85"><stop stop-color="#6f6ce9" stop-opacity="0.2"/><stop offset="1" stop-color="#050712" stop-opacity="0"/></radialGradient>
<marker id="tp-ar-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6f6ce9" stroke-width="1.5"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.tp-ar-dark-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.tp-ar-dark-flow{animation:tp-ar-dark-flow 5.5s linear infinite}@keyframes tp-ar-dark-flow{to{stroke-dashoffset:-180}}.tp-ar-dark-pulse{animation:tp-ar-dark-pulse 4.2s ease-in-out infinite}@keyframes tp-ar-dark-pulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style>
<rect width="1000" height="540" rx="14" fill="#050712"/>
<rect width="1000" height="540" rx="14" fill="url(#tp-ar-dark-halo)"/>
<pattern id="tp-ar-dark-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#171841" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="1000" height="540" rx="14" fill="url(#tp-ar-dark-grid)"/><text x="36" y="42" fill="#969cc4" font-size="12" letter-spacing="2">ARCHITECTURE</text>
<text x="36" y="72" fill="#eef4fd" font-size="19" font-weight="700">One Go binary · four packages · zero model calls</text><rect x="36" y="110" width="210" height="150" rx="10" fill="#0a0d1d" stroke="#171841" stroke-dasharray="4 4"/>
<text x="52" y="136" fill="#eef4fd" font-size="13" font-weight="600" class="tp-ar-dark-mono">~/.claude/projects/</text>
<text x="52" y="156" fill="#eef4fd" font-size="13" class="tp-ar-dark-mono">  *.jsonl</text>
<text x="52" y="194" fill="#969cc4" font-size="11.5">harness writes; tailpin never writes</text>
<text x="52" y="214" fill="#969cc4" font-size="11.5">nested subagent / journal files</text>
<text x="52" y="230" fill="#969cc4" font-size="11.5">never surface</text>
<text x="52" y="252" fill="#6f6ce9" font-size="11" font-weight="700">READ-ONLY</text><rect x="300" y="110" width="400" height="66" rx="10" fill="#0c101f" stroke="#171841"/>
<text x="318" y="137" fill="#eef4fd" font-size="14" font-weight="700">transcript adapter</text>
<text x="318" y="158" fill="#969cc4" font-size="11" class="tp-ar-dark-mono">Claude-Code-style JSONL dialect: message records, uuid, ISO 8601</text><rect x="300" y="196" width="400" height="66" rx="10" fill="#0c101f" stroke="#171841"/>
<text x="318" y="223" fill="#eef4fd" font-size="14" font-weight="700">pin extractor</text>
<text x="318" y="244" fill="#969cc4" font-size="11" class="tp-ar-dark-mono">deterministic ranking: recency · EN/ZH markers · code blocks · paths</text><rect x="300" y="282" width="400" height="66" rx="10" fill="#0c101f" stroke="#171841"/>
<text x="318" y="309" fill="#eef4fd" font-size="14" font-weight="700">pin store</text>
<text x="318" y="330" fill="#969cc4" font-size="11" class="tp-ar-dark-mono">atomic write, temp + rename; revision continues from disk</text><path d="M500 180 V188" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-ar-dark-arrow)" class="tp-ar-dark-flow"/><path d="M500 266 V274" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-ar-dark-arrow)" class="tp-ar-dark-flow"/><path d="M254 143 H288" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-ar-dark-arrow)" class="tp-ar-dark-flow"/><rect x="744" y="110" width="220" height="76" rx="10" fill="#0c101f" stroke="#6f6ce9" stroke-width="1.4"/>
<text x="760" y="140" fill="#6f6ce9" font-size="14" font-weight="700">TUI (bubbletea)</text>
<text x="760" y="162" fill="#969cc4" font-size="11.5">answer pane / span viewer</text><rect x="744" y="200" width="220" height="76" rx="10" fill="#0c101f" stroke="#6f6ce9" stroke-width="1.4"/>
<text x="760" y="230" fill="#6f6ce9" font-size="14" font-weight="700">diff</text>
<text x="760" y="252" fill="#969cc4" font-size="11.5">CLI output, claim-level</text><path d="M706 148 H732" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-ar-dark-arrow)" class="tp-ar-dark-flow"/><path d="M706 238 H732" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-ar-dark-arrow)" class="tp-ar-dark-flow"/><path d="M500 352 V370" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-ar-dark-arrow)" class="tp-ar-dark-flow"/><rect x="300" y="378" width="400" height="150" rx="10" fill="#0a0d1d" stroke="#6f6ce9" stroke-width="1.4"/>
<text x="318" y="402" fill="#eef4fd" font-size="13" font-weight="700" class="tp-ar-dark-mono">~/.tailpin/sessions/&lt;session_id&gt;.pin.json</text>
<text x="318" y="426" fill="#969cc4" font-size="11.5" class="tp-ar-dark-mono">PinnedAnswer { session_id, revision, updated_at,</text>
<text x="318" y="444" fill="#969cc4" font-size="11.5" class="tp-ar-dark-mono">  confidence, claims[] }</text>
<text x="318" y="466" fill="#969cc4" font-size="11.5" class="tp-ar-dark-mono">Claim { text, kind: finding|plan|fix|caveat,</text>
<text x="318" y="484" fill="#969cc4" font-size="11.5" class="tp-ar-dark-mono">  span { file, line_start..line_end, byte_start..byte_end,</text>
<text x="318" y="502" fill="#969cc4" font-size="11.5" class="tp-ar-dark-mono">    message_uuid, timestamp } }</text>
<text x="318" y="520" fill="#6f6ce9" font-size="10.5" font-weight="700">ATOMIC WRITE · TEMP + RENAME</text><text x="730" y="320" fill="#969cc4" font-size="11">diff prefers stored pin artifacts;</text>
<text x="730" y="336" fill="#969cc4" font-size="11">unwatched sessions extracted on the spot</text>
</svg>
