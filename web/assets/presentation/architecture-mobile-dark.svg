<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800" data-palette="5956e6-af6ae7-acc6f6-ab1706e61153" role="img" aria-labelledby="tp-arm-dark-title tp-arm-dark-desc"><title id="tp-arm-dark-title">tailpin architecture (mobile)</title><desc id="tp-arm-dark-desc">The package stack and pin artifact as a vertical composition.</desc>
<defs>
<linearGradient id="tp-arm-dark-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f6ce9"/><stop offset="0.55" stop-color="#af6ae7"/><stop offset="1" stop-color="#acc6f6"/></linearGradient>
<radialGradient id="tp-arm-dark-halo" cx="0.62" cy="0.36" r="0.85"><stop stop-color="#6f6ce9" stop-opacity="0.2"/><stop offset="1" stop-color="#050712" stop-opacity="0"/></radialGradient>
<marker id="tp-arm-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#6f6ce9" stroke-width="1.5"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.tp-arm-dark-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.tp-arm-dark-flow{animation:tp-arm-dark-flow 5.5s linear infinite}@keyframes tp-arm-dark-flow{to{stroke-dashoffset:-180}}.tp-arm-dark-pulse{animation:tp-arm-dark-pulse 4.2s ease-in-out infinite}@keyframes tp-arm-dark-pulse{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style>
<rect width="400" height="800" rx="14" fill="#050712"/>
<rect width="400" height="800" rx="14" fill="url(#tp-arm-dark-halo)"/>
<pattern id="tp-arm-dark-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#171841" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="400" height="800" rx="14" fill="url(#tp-arm-dark-grid)"/><text x="28" y="44" fill="#969cc4" font-size="12" letter-spacing="2">ARCHITECTURE</text><text x="28" y="74" fill="#eef4fd" font-size="18" font-weight="700">One binary, four packages</text><rect x="28" y="104" width="344" height="78" rx="10" fill="#0a0d1d" stroke="#171841" stroke-width="1" stroke-dasharray="4 4"/>
<text x="42" y="129" fill="#eef4fd" font-size="13" font-weight="700" class="tp-arm-dark-mono">~/.claude/projects/*.jsonl</text><text x="42" y="148" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">read-only · harness writes</text><text x="42" y="165" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">subagent / journal never surface</text><path d="M200 185 V201" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-arm-dark-arrow)" class="tp-arm-dark-flow"/><rect x="28" y="208" width="344" height="61" rx="10" fill="#0c101f" stroke="#171841" stroke-width="1" />
<text x="42" y="233" fill="#eef4fd" font-size="13" font-weight="700" >transcript adapter</text><text x="42" y="252" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">one dialect: Claude-Code-style JSONL</text><path d="M200 272 V288" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-arm-dark-arrow)" class="tp-arm-dark-flow"/><rect x="28" y="295" width="344" height="61" rx="10" fill="#0c101f" stroke="#171841" stroke-width="1" />
<text x="42" y="320" fill="#eef4fd" font-size="13" font-weight="700" >pin extractor</text><text x="42" y="339" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">deterministic ranking, no LLM</text><path d="M200 359 V375" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-arm-dark-arrow)" class="tp-arm-dark-flow"/><rect x="28" y="382" width="344" height="61" rx="10" fill="#0c101f" stroke="#171841" stroke-width="1" />
<text x="42" y="407" fill="#eef4fd" font-size="13" font-weight="700" >pin store</text><text x="42" y="426" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">atomic write · temp + rename</text><path d="M200 446 V462" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-arm-dark-arrow)" class="tp-arm-dark-flow"/><rect x="28" y="469" width="344" height="95" rx="10" fill="#0a0d1d" stroke="#6f6ce9" stroke-width="1.5" />
<text x="42" y="494" fill="#6f6ce9" font-size="13" font-weight="700" class="tp-arm-dark-mono">pin artifact</text><text x="42" y="513" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">~/.tailpin/sessions/&lt;session_id&gt;.pin.json</text><text x="42" y="530" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">PinnedAnswer { revision, claims[] }</text><text x="42" y="547" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">Claim { kind, span: line·byte·uuid }</text><path d="M200 567 V583" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-arm-dark-arrow)" class="tp-arm-dark-flow"/><rect x="28" y="590" width="344" height="61" rx="10" fill="#0c101f" stroke="#6f6ce9" stroke-width="1.5" />
<text x="42" y="615" fill="#6f6ce9" font-size="13" font-weight="700" >TUI (bubbletea)</text><text x="42" y="634" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">answer pane / span viewer</text><path d="M200 654 V670" fill="none" stroke="#6f6ce9" stroke-width="1.6" stroke-linecap="round"  marker-end="url(#tp-arm-dark-arrow)" class="tp-arm-dark-flow"/><rect x="28" y="677" width="344" height="61" rx="10" fill="#0c101f" stroke="#6f6ce9" stroke-width="1.5" />
<text x="42" y="702" fill="#6f6ce9" font-size="13" font-weight="700" >diff</text><text x="42" y="721" fill="#969cc4" font-size="10.5" class="tp-arm-dark-mono">CLI output, claim-level</text><text x="28" y="770" fill="#969cc4" font-size="11">zero model calls · fully offline · no API key</text>
</svg>
